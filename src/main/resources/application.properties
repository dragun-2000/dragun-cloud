### config profile spring
spring.profiles.active=development
spring.application.name=Profiles
server.port=8085
server.address=0.0.0.0
### context path
server.servlet.context-path=/
### config thymeleaf
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
### i18n messages (header + bilingual)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
### config session time out
server.servlet.session.timeout=60m
# Chỉ dùng cookie JSESSIONID — không gắn ;jsessionid= vào URL (xung đột Spring Security firewall).
server.servlet.session.tracking-modes=cookie
### config tomcat
server.tomcat.accesslog.enabled=false
server.tomcat.basedir=/tmp
server.use-forward-headers=true
server.tomcat.remote-ip-header=x-forwarded-for
server.tomcat.protocol-header=x-forwarded-proto
# Tomcat connection timeout for large file uploads (30 minutes)
server.tomcat.connection-timeout=1800000
# Max post size (should match max-request-size)
server.tomcat.max-http-post-size=104857600
# Max swallow size for aborted uploads
server.tomcat.max-swallow-size=104857600
### Thread pool manager
threadpoll.corePoolSize=5
threadpoll.maxPoolSize=10
threadpoll.keepAliveSeconds=10000
threadpoll.queueCapacity=10000000
threadpoll.allowCoreThreadTimeOut=true
### config logging level - Chỉ hiển thị INFO và ERROR
logging.level.root=info
logging.level.org.springframework.boot=info
logging.level.org.springframework.web=info
logging.level.org.springframework.security=info
logging.level.org.springframework.jdbc=info
logging.level.org.hibernate=info
logging.level.vn.co.cake=info
logging.level.org.springframework.data.jpa.repository=info
#spring.jpa.open-in-view=true

# jwt
jwt.secure.secret=qaX1lZDjBe8KRi2Hr4iSbepomV4nbzuoEaUKipiceA0BsfCzl8zUgcfmmqEdt9jp

spring.jpa.open-in-view=false
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.file-size-threshold=20MB

spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

spring.web.resources.static-locations=classpath:/static/,file:/var/www/html/images/
spring.mvc.static-path-pattern=/**

server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Tắt log SQL Hibernate
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlStatementLogger=OFF

# OpenAI Configuration
openai.api.key=
openai.api.url=https://api.openai.com/v1/chat/completions
openai.model=gpt-4o-mini
openai.temperature=0.7
openai.max-tokens=500
openai.timeout=30000

# VietQR (override per profile)
vietqr.enabled=false
vietqr.api.base-url=https://dev.vietqr.org
vietqr.checkout.expire-hours=24

# Tingting SMS — https://tingting.im/tingting-sms/ (apikey + brandname trong dashboard Developers)
tingting.api.key=
tingting.api.sender=de base
tingting.api.url=https://v1.tingting.im/api/sms
# OTP (giữ prefix speedsms.otp.* để tương thích OtpVerificationService)
speedsms.otp.expiration.minutes=5
speedsms.otp.max.attempts=3
speedsms.otp.rate.limit.per.hour=3



