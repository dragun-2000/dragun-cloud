# Redis debase-redis
spring.redis.host=${SPRING_REDIS_HOST:debase-redis}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.database=0
spring.redis.timeout=10000
spring.redis.password=
spring.redis.jedis.pool.max-wait=10000
spring.session.store-type=redis

spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=cake:session

# Postgres debase-db
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://debase-db:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dragun}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Picachu@123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.initialization-mode=always
spring.datasource.hikari.initialization-fail-timeout=10000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.pool-name=ConnPool

spring.jpa.database=POSTGRESQL
spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

### Mail service
