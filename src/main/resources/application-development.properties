# Redis
spring.redis.host=${SPRING_REDIS_HOST:debase-redis}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.database=0
spring.redis.timeout=10000
spring.redis.password=
spring.redis.jedis.pool.max-wait=10000
spring.session.store-type=redis

spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=cake:session

# Postgres
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/debase}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dragun}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Picachu@123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.initialization-mode=always
spring.datasource.hikari.initialization-fail-timeout=10000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.pool-name=ConnPool

spring.jpa.database=POSTGRESQL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Session / Security
server.servlet.session.timeout=15d
remember-me.session.timeout=1296000

# Logging
logging.level.root=info
logging.level.org.springframework.web=info
logging.level.org.hibernate.SQL=debug
logging.file.name=/app/log/app.log

