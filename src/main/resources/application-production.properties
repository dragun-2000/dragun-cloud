### database
spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
# postgres connect
spring.datasource.url=jdbc:postgresql://ec2-13-215-250-65.ap-southeast-1.compute.amazonaws.com:5432/postgres
spring.datasource.username=posgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver
# Hikarin
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.initialization-mode=always
spring.datasource.hikari.initialization-fail-timeout=10000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.pool-name=ConnPool
