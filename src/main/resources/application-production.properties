# ============================================================================
# VNPAY payment integration — môi trường PRODUCTION
# Tài liệu: https://sandbox.vnpayment.vn/apis/docs/thanh-toan-pay/pay.html
# Mọi giá trị đọc từ biến môi trường; giá trị sau dấu ':' là mặc định khi biến chưa đặt.
# Thiếu VNPAY_TMN_CODE / VNPAY_HASH_SECRET / VNPAY_RETURN_URL → app vẫn chạy, chỉ ẩn VNPAY ở trang thanh toán.
# ============================================================================
# Bật/tắt VNPAY ở trang thanh toán.
vnpay.enabled=${VNPAY_ENABLED:true}
# Mã định danh kết nối (vnp_TmnCode) — lấy trong email "thông tin kết nối" VNPAY gửi đối tác.
vnpay.tmn-code=${VNPAY_TMN_CODE:NTHTEST1}
# Secret key ký checksum HMAC-SHA512 (vnp_HashSecret) — CHỈ qua env, không default trong repo.
#   Đặt VNPAY_HASH_SECRET trên server/.env (lấy từ file zip VNPAY gửi email chủ tài khoản).
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
# URL redirect thanh toán (GET).
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
# URL API truy vấn kết quả (querydr) / hoàn tiền (refund).
vnpay.api-url=${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
# Return URL: trang khách quay về sau thanh toán (HTTPS public).
vnpay.return-url=${VNPAY_RETURN_URL:https://debase.vn/vnpay/return}
# IPN URL KHÔNG cấu hình ở đây — [CÒN THIẾU] gửi https://debase.vn/vnpay/ipn cho KT VNPAY đăng ký (HTTPS, public).
# Mã danh mục hàng hoá (vnp_OrderType) — mặc định "other"; xác nhận lại mã ngành thời trang với VNPAY.
vnpay.order-type=${VNPAY_ORDER_TYPE:other}
# Thời hạn thanh toán (phút) gửi qua vnp_ExpireDate.
vnpay.expire-minutes=${VNPAY_EXPIRE_MINUTES:5}
# Chờ thêm (phút) sau hạn trước khi job bắt đầu QueryDR (IPN có thể trễ).
vnpay.expire-grace-minutes=${VNPAY_EXPIRE_GRACE_MINUTES:0}
# Phút sau expiresAt: QueryDR vẫn lỗi/không kết luận → huỷ đơn + hoàn kho.
vnpay.query-dr-give-up-minutes=${VNPAY_QUERY_DR_GIVE_UP_MINUTES:0}
