<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="header :: common-header"></head>
<body>
  <div class="wrapper">
    <div th:replace="header :: header"></div>
    
    <div class="main main--pageProducts">
    <div class="wrap products-page">
      <form class="products-toolbar products-toolbar--corner" method="get"
            th:if="${sortOptions != null}"
            th:action="${searchName != null} ? @{/products/search} : @{/products/group/{category}(category=${category})}">
        <input type="hidden" name="name" th:if="${searchName != null}" th:value="${searchName}">
        <label class="products-sort" for="sortBy">
          <span class="products-sort-label" th:text="#{home.sort.label}">Sort by</span>
          <select id="sortBy" name="sortBy" class="products-sort-select" onchange="this.form.submit()">
            <option th:each="option : ${sortOptions}"
                    th:value="${option.name()}"
                    th:text="#{${option.messageKey}}"
                    th:selected="${option == currentSort}"></option>
          </select>
        </label>
        <noscript>
          <button type="submit" class="btn btn-outline-secondary btn-sm" th:text="#{home.sort.apply}">Apply</button>
        </noscript>
      </form>
      <div class="banner-products" th:if="${category} == THEORE">
        <img src="/images/data/thumb-banner02.jpg" alt="">
      </div>
      <div class="groupProducts">
        <div class="title">
          <h2 class="title-tlt text-shadow-bold text-responsive"
              th:with="saleAsBlackFriday=${category == 'SALE' and saleMenu != null and saleMenu.name() == 'BLACK_FRIDAY'}"
              th:text="${saleAsBlackFriday} ? #{header.blackFriday} : ${category}"
              th:classappend="${saleAsBlackFriday or category == 'BLACK FRIDAY'} ? 'is-black-friday' : ''">
          </h2>
        </div>
        <div class="products-list">
          <ul class="list-style-none">
            <li th:each="product: ${products}">
              <a class="products-inner" th:href="@{/products(id=${product.id})}">
                <div class="products-thumb">
                  <div class="thumbnail">
                    <img th:src="${product.image}" alt="">
                  </div>
                </div>
                <div class="products-content">
                  <h3 class="products-title" th:text="${product.name}"></h3>
                  <h3 th:if="${product.outStock}" style="color: red;">(Hết Hàng)</h3>
                  <p class="products-price">
                    <del th:if="${product.hasDiscount}" class="products-price" th:text="${product.priceDisplay} + VND"></del>
                    <p th:style="${product.hasDiscount} ? 'color: red;' : ''" class="price-standard"><span class="price" th:text="${product.discountPriceDisplay} + VND"></span></p>
                  </p>
                  <div class="products-color">
                    <span th:each="color : ${product.codeColors}" th:style="'background:' + ${color}"></span>
                  </div>
                </div>
              </a>
            </li>
          </ul>
        </div>

        <div th:replace = "~{paging :: bottom-pagination}"></div>

      </div>
    </div>
  </div><!--/main -->
  <div th:replace="header :: footer"></div>
</div><!--/wrapper -->
</body>
</html>
