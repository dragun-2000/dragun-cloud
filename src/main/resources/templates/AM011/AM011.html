<!DOCTYPE html>

<html xmlns:th="http://www.w3.org/1999/xhtml" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"

      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{template/baseManage.html}">

<div class="container-fluid" layout:fragment="main-content">

  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />



  <style>

    .vietqr-pilot-toggle {

      display: inline-flex;

      width: 100%;

      max-width: 360px;

      border-radius: 8px;

      overflow: hidden;

      border: 1px solid #ced4da;

      background: #e9ecef;

    }



    .vietqr-pilot-toggle__btn {

      flex: 1;

      border: none;

      padding: 12px 16px;

      font-weight: 700;

      font-size: 0.95rem;

      background: transparent;

      color: #868e96;

      transition: background-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;

      cursor: pointer;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 6px;

    }



    .vietqr-pilot-toggle__btn:focus {

      outline: none;

      box-shadow: inset 0 0 0 2px rgba(0, 123, 255, 0.35);

    }



    .vietqr-pilot-toggle__btn--on.is-active {

      background: #28a745;

      color: #fff;

      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.12);

    }



    .vietqr-pilot-toggle__btn--off.is-active {

      background: #dc3545;

      color: #fff;

      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.12);

    }



    .vietqr-pilot-toggle__btn i {

      font-size: 1.1rem;

      line-height: 1;

    }

  </style>



  <div class="row">

    <div th:replace="~{template/sidebar :: sidebar}"></div>

    <main class="main-content col-lg-10 col-md-9 col-sm-12 p-0 offset-lg-2 offset-md-3">

      <div th:replace="~{template/navbar :: navbar}"></div>

      <div class="main-content-container container-fluid">

        <div class="page-header text-center no-gutters py-4">

          <h3 class="page-title font-weight-bold">Cấu hình VietQR Pilot</h3>

          <p class="text-muted mb-0">Bật công khai hoặc chế độ pilot (mật khẩu do admin cấp)</p>

        </div>



        <div class="info-fr-1400 w-800 mt-3" sec:authorize="hasRole('ROLE_ADMIN')">

          <div class="card card-small mb-4">

            <div class="card-body">

              <div class="form-group">

                <label class="font-weight-bold d-block mb-2">Bật Tính Năng Sử Dụng VIETQR</label>

                <input type="hidden" id="visibleToAll" th:value="${visibleToAll}" />

                <div class="vietqr-pilot-toggle" role="group" aria-label="Trạng thái VietQR">

                  <button type="button" id="vietqr-toggle-on"

                          class="vietqr-pilot-toggle__btn vietqr-pilot-toggle__btn--on"

                          th:classappend="${visibleToAll} ? ' is-active' : ''">

                    <i class="material-icons">toggle_on</i>

                    Bật

                  </button>

                  <button type="button" id="vietqr-toggle-off"

                          class="vietqr-pilot-toggle__btn vietqr-pilot-toggle__btn--off"

                          th:classappend="${!visibleToAll} ? ' is-active' : ''">

                    <i class="material-icons">toggle_off</i>

                    Tắt

                  </button>

                </div>

                <small class="form-text text-muted mt-2" id="vietqr-toggle-hint"></small>

              </div>



              <div class="form-group" id="pilot-password-group">

                <label class="font-weight-bold" for="pilotPassword">Mật khẩu pilot</label>

                <input type="password" class="form-control" id="pilotPassword" autocomplete="new-password"

                       placeholder="Nhập mật khẩu mới (để trống nếu giữ mật khẩu cũ)"/>

                <small class="form-text text-muted">

                  <span th:if="${hasPilotPassword}">Đã có mật khẩu pilot. Để trống khi lưu = giữ nguyên.</span>

                  <span th:if="${!hasPilotPassword}">Chưa có mật khẩu — bắt buộc khi tắt VietQRVisible.</span>

                </small>

              </div>



              <p class="small text-muted mb-3" th:if="${lastUpdated != null}">

                Cập nhật lần cuối: <span th:text="${#dates.format(lastUpdated, 'yyyy-MM-dd HH:mm')}"></span>

                <span th:if="${lastUpdater != null}" th:text="' bởi ' + ${lastUpdater}"></span>

              </p>



              <button type="button" id="btn-save-vietqr-settings" class="btn custom-btn-info">Lưu cấu hình</button>

              <span id="save-status" class="ml-3 small"></span>

            </div>

          </div>

        </div>



        <div class="alert alert-warning" sec:authorize="!hasRole('ROLE_ADMIN')">

          Chỉ tài khoản ADMIN mới được thay đổi cấu hình VietQR pilot.

        </div>

      </div>

    </main>

  </div>



  <script th:src="@{/js/jquery-3.3.1.min.js}"></script>

  <script th:src="@{/js/AM011/AM011.js}"></script>

</div>

</html>
