<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{template/baseManage.html}">
<div class="container-fluid" layout:fragment="main-content">
    <div class="row">

        <div th:replace = "~{template/sidebar :: sidebar}"></div>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <main class="main-content col-lg-10 col-md-9 col-sm-12 p-0 offset-lg-2 offset-md-3">
            <div th:replace = "~{template/navbar :: navbar}"></div>

            <div class="main-content-container container-fluid">
                <div class="page-header text-center no-gutters py-2 mb-2">
                    <h3 class="page-title font-weight-bold">Đăng Kí Sản Phẩm</h3>
                </div>

                <form id="register_product_form" name="f" th:object="${product}" class="needs-validation ml-3" novalidate enctype="multipart/form-data">
                    <div class="form-group row">
                        <label for="name" class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Tên Sản Phẩm<span class="red">※</span></label>
                        <div class="col-sm-12 col-md-9 col-lg-7 col-xl-6 col-form-label font-weight-bold">
                            <input id="name" type="text" name="name" class="form-control form-ctrl" maxlength="255" th:value="*{name}" th:field="*{name}" required>
                            <div class="invalid-feedback">
                                Yêu Cầu Nhập Tên Sản Phẩm
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group row">
                        <label for="code" class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Mã Sản Phẩm<span class="red">※</span></label>
                        <div class="col-sm-12 col-md-9 col-lg-7 col-xl-6 col-form-label font-weight-bold">
                            <input id="code" type="text" name="code" class="form-control form-ctrl" maxlength="255" th:value="*{code}" th:field="*{code}" required>
                            <div class="invalid-feedback">
                                Yêu Cầu Nhập Mã Sản Phẩm
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group row">
                        <label for="code" class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Mã Sản Phẩm Con<span class="red"></span></label>
                        <div class="col-sm-12 col-md-9 col-lg-7 col-xl-6 col-form-label font-weight-bold">
                            <input id="subCode" type="text" name="subCode" class="form-control form-ctrl" maxlength="255" th:value="*{subCode}" th:field="*{subCode}">
                            <div class="invalid-feedback">
                                Yêu Cầu Nhập Mã Sản Phẩm
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group row">
                        <label for="description" class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Mô Tả Về Sản Phẩm</label>
                        <div class="col-sm-12 col-md-9 col-lg-7 col-xl-6 col-form-label font-weight-bold">
                            <textarea style="min-height: 200px;" id="description" type="text" name="description" class="form-control form-ctrl" th:value="*{description}" th:field="*{description}"></textarea>
                        </div>
                    </div>
                    
                    <div class="form-group row">
                        <label for="descriptionSize" class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Mô Tả Về Size Sản Phẩm</label>
                        <div class="col-sm-12 col-md-9 col-lg-7 col-xl-6 col-form-label font-weight-bold">
                            <textarea style="min-height: 200px;" id="descriptionSize" type="text" name="descriptionSize" class="form-control form-ctrl" th:value="*{descriptionSize}" th:field="*{descriptionSize}"></textarea>
                        </div>
                    </div>
                    
                    <div class="form-group row">
                        <label for="productInformation" class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Thông Tin Sản Phẩm (Product information)</label>
                        <div class="col-sm-12 col-md-9 col-lg-7 col-xl-6 col-form-label font-weight-bold">
                            <textarea style="min-height: 200px;" id="productInformation" name="productInformation" class="form-control form-ctrl" th:value="*{productInformation}" th:field="*{productInformation}" placeholder="Nội dung hiển thị tại mục Product information trên trang chi tiết sản phẩm"></textarea>
                        </div>
                    </div>
                    
                    <div class="form-group row">
                        <label for="price" class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Giá Sản Phẩm<span style="color: red">※</span></label>
                        <div class="col-sm-12 col-md-9 col-lg-7 col-xl-6 col-form-label font-weight-bold">
                            <input min="0" max="999999999" id="price" type="number" name="color" class="form-control form-ctrl" maxlength="9" th:value="*{price}" th:field="*{price}" required>
                            <div class="invalid-feedback">
                                Yêu Cầu Nhập Giá Sản Phẩm Từ 0 ~ 99999999 VND
                            </div>
                        </div>
                    </div>

                    <div class="form-group row">
                        <label for="stockQuantity" class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Số Lượng Hàng Còn <span class="red">※</span></label>
                        <div class="col-sm-12 col-md-9 col-lg-7 col-xl-6 col-form-label font-weight-bold">
                            <input id="stockQuantity" type="number" name="stockQuantity" class="form-control form-ctrl" maxlength="255" th:value="*{stockQuantity}" th:field="*{stockQuantity}" required>
                            <div class="invalid-feedback">
                                Yêu Cầu Nhập Số Lượng Sản Phẩm Còn Hàng
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group row">
                        <label for="discount" class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Giảm Giá 0 ~ 99% <span class="red"></span></label>
                        <div class="col-sm-12 col-md-9 col-lg-7 col-xl-6 col-form-label font-weight-bold">
                            <input min="0" id="discount" type="number" name="discount" class="form-control form-ctrl" maxlength="9" th:value="*{discount}" th:field="*{discount}">
                            <div class="invalid-feedback">
                                Yêu Cầu Nhập Giảm giá
                            </div>
                        </div>
                    </div>

                    <div class="form-group row">
                        <label class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Loại Sản Phẩm<span class="red">※</span></label>
                        <div class="col-sm-12 col-md-9 col-lg-7 col-xl-6 col-form-label font-weight-bold">
                            <select id="categorySelect" th:field="*{category}" name="category" class="form-control form-ctrl" multiple>
                                <option th:each="category : ${categories}"
                                        th:value="${category.name}"
                                        th:text="${category.name}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group row">
                        <label for="colorBase" class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Màu Sản Phẩm</label>
                        <div class="col-sm-12 col-md-9 col-lg-7 col-xl-6 col-form-label font-weight-bold">
                            <input id="colorBase" type="text" name="colorBase" class="form-control form-ctrl" maxlength="255" th:value="*{colorBase}" th:field="*{colorBase}">
                        </div>
                    </div>

                    <div class="form-group row">
                        <label for="sizeBase" class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Size Sản Phẩm</label>
                        <div class="col-sm-12 col-md-9 col-lg-7 col-xl-6 col-form-label font-weight-bold">
                            <input id="sizeBase" type="text" name="sizeBase" class="form-control form-ctrl" maxlength="255" th:value="*{sizeBase}" th:field="*{sizeBase}">
                        </div>
                    </div>
                    
                    <div class="form-group row">
                        <label class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Ảnh Sản Phẩm <span class="red">※</span></label>
                        <div class="col-sm-12 col-md-9 col-lg-7 col-xl-6 col-form-label font-weight-bold">
                            <input type="file" id="file" name="file" accept="/*" onchange="previewImage(event, 'imagePreview')" required/><br/>
                            <br>
                            <img class="img-preview" id="imagePreview" th:src="${product.image}" alt="Preview Image" />
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Thumbnail 1<span class="red"></span></label>
                        <div class="col-sm-12 col-md-9 col-lg-7 col-xl-6 col-form-label font-weight-bold">
                            <input type="file" id="file1" name="file1" accept="/*" onchange="previewImage(event, 'imagePreview1')"/><br/>
                            <br>
                            <img class="img-thumbnail-preview" id="imagePreview1" th:src="${product.image1}" alt="Preview Thumbnail 1" />
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Thumbnail 2<span class="red"></span></label>
                        <div class="col-sm-12 col-md-9 col-lg-7 col-xl-6 col-form-label font-weight-bold">
                            <input type="file" id="file2" name="file2" accept="/*" onchange="previewImage(event, 'imagePreview2')"/><br/>
                            <br>
                            <img class="img-thumbnail-preview" id="imagePreview2" th:src="${product.image2}" alt="Preview Thumbnail 2" />
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Thumbnail 3<span class="red"></span></label>
                        <div class="col-sm-12 col-md-9 col-lg-7 col-xl-6 col-form-label font-weight-bold">
                            <input type="file" id="file3" name="file3" accept="/*" onchange="previewImage(event, 'imagePreview3')"/><br/>
                            <br>
                            <img class="img-thumbnail-preview" id="imagePreview3" th:src="${product.image3}" alt="Preview Thumbnail 3" />
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Thumbnail 4<span class="red"></span></label>
                        <div class="col-sm-12 col-md-9 col-lg-7 col-xl-6 col-form-label font-weight-bold">
                            <input type="file" id="file4" name="file4" accept="/*" onchange="previewImage(event, 'imagePreview4')"/><br/>
                            <br>
                            <img class="img-thumbnail-preview" id="imagePreview4" th:src="${product.image4}" alt="Preview Thumbnail 4" />
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Thumbnail 5<span class="red"></span></label>
                        <div class="col-sm-12 col-md-9 col-lg-7 col-xl-6 col-form-label font-weight-bold">
                            <input type="file" id="file5" name="file5" accept="/*" onchange="previewImage(event, 'imagePreview5')"/><br/>
                            <br>
                            <img class="img-thumbnail-preview" id="imagePreview5" th:src="${product.image5}" alt="Preview Thumbnail 5" />
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Thumbnail 6<span class="red"></span></label>
                        <div class="col-sm-12 col-md-9 col-lg-7 col-xl-6 col-form-label font-weight-bold">
                            <input type="file" id="file6" name="file6" accept="/*" onchange="previewImage(event, 'imagePreview6')"/><br/>
                            <br>
                            <img class="img-thumbnail-preview" id="imagePreview6" th:src="${product.image6}" alt="Preview Thumbnail 6" />
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Thumbnail 7<span class="red"></span></label>
                        <div class="col-sm-12 col-md-9 col-lg-7 col-xl-6 col-form-label font-weight-bold">
                            <input type="file" id="file7" name="file7" accept="/*" onchange="previewImage(event, 'imagePreview7')"/><br/>
                            <br>
                            <img class="img-thumbnail-preview" id="imagePreview7" th:src="${product.image7}" alt="Preview Thumbnail 7" />
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Thumbnail 8<span class="red"></span></label>
                        <div class="col-sm-12 col-md-9 col-lg-7 col-xl-6 col-form-label font-weight-bold">
                            <input type="file" id="file8" name="file8" accept="/*" onchange="previewImage(event, 'imagePreview8')"/><br/>
                            <br>
                            <img class="img-thumbnail-preview" id="imagePreview8" th:src="${product.image8}" alt="Preview Thumbnail 8" />
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Thumbnail 9<span class="red"></span></label>
                        <div class="col-sm-12 col-md-9 col-lg-7 col-xl-6 col-form-label font-weight-bold">
                            <input type="file" id="file9" name="file9" accept="/*" onchange="previewImage(event, 'imagePreview9')"/><br/>
                            <br>
                            <img class="img-thumbnail-preview" id="imagePreview9" th:src="${product.image9}" alt="Preview Thumbnail 9" />
                        </div>
                    </div>

                    <div class="form-group row">
                        <label class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Sản Phẩm Liên Quan 1<span class="red"></span></label>
                        <div class="col-sm-12 col-md-9 col-lg-7 col-xl-6 col-form-label font-weight-bold">
                            <select th:field="*{relatedProduct1}" id="relatedProduct1" name="relatedProduct1" class="form-control form-ctrl">
                                <option value="">Chọn Sản Phẩm Liên Quan 1</option>
                                <option th:each="product : ${products}" 
                                        th:value="${product.code}" 
                                        th:text="${product.name}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Sản Phẩm Liên Quan 2<span class="red"></span></label>
                        <div class="col-sm-12 col-md-9 col-lg-7 col-xl-6 col-form-label font-weight-bold">
                            <select th:field="*{relatedProduct2}" id="relatedProducts2" name="relatedProduct2" class="form-control form-ctrl">
                                <option value="">Chọn Sản Phẩm Liên Quan 2</option>
                                <option th:each="product : ${products}" 
                                        th:value="${product.code}" 
                                        th:text="${product.name}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Sản Phẩm Liên Quan 3<span class="red"></span></label>
                        <div class="col-sm-12 col-md-9 col-lg-7 col-xl-6 col-form-label font-weight-bold">
                            <select th:field="*{relatedProduct3}" id="relatedProduct3" name="relatedProduct3" class="form-control form-ctrl">
                                <option value="">Chọn Sản Phẩm Liên Quan 3</option>
                                <option th:each="product : ${products}" 
                                        th:value="${product.code}" 
                                        th:text="${product.name}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Sản Phẩm Liên Quan 4<span class="red"></span></label>
                        <div class="col-sm-12 col-md-9 col-lg-7 col-xl-6 col-form-label font-weight-bold">
                            <select th:field="*{relatedProduct4}" id="relatedProduct4" name="relatedProduct4" class="form-control form-ctrl">
                                <option value="">Chọn Sản Phẩm Liên Quan 4</option>
                                <option th:each="product : ${products}" 
                                        th:value="${product.code}" 
                                        th:text="${product.name}"></option>
                            </select>
                        </div>
                    </div>

                    <div style="text-align: center;">
                        <button class="btn custom-btn-info btn-140 mt-3 mb-4" type="submit" role="button" aria-pressed="true">Tạo Sản Phẩm 
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <div class="modal fade" id="register-product-success" tabindex="-1" role="dialog" data-backdrop="static"
         aria-labelledby="modalConfirmLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered w-450" role="document">
            <div class="modal-content">
                <div class="modal-body">
                    <div  class="col-12 modal-title text-center mb-4"><i id="custom-icon" class="fas fa-check-circle"></i></div>
                    <div class="col-12 modal-title text-center mb-4">
                        <label id="message-success"></label>
                    </div>

                    <div class="modal-footer justify-content-center border-top-0">
                        <a class="btn custom-btn-info btn-120 mr-4" th:href="@{/AM/AM003}"
                           aria-pressed="true" id="">OK
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="register-product-error" tabindex="-1" role="dialog" data-backdrop="static"
         aria-labelledby="modalConfirmLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered w-450" role="document">
            <div class="modal-content">
                <div class="modal-body">
                    <div  class="col-12 modal-title text-center mb-4"><i class="fas fa-exclamation-triangle"></i></div>
                    <div class="col-12 modal-title text-center mb-4">
                        <label id="message-error"></label>
                    </div>

                    <div class="modal-footer justify-content-center border-top-0">
                        <button class="btn custom-btn-info btn-120 mr-4" type="button" role="button"
                                aria-pressed="true" data-dismiss="modal">OK
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        setTimeout(function() {
            if ($.fn.select2) {
                $('#categorySelect').select2({
                    placeholder: "Chọn loại sản phẩm",
                    allowClear: true
                });
            } else {
                console.error("Select2 vẫn chưa được tải!");
            }
        }, 500);
    </script>

    <script th:src="@{/js/validation.common.js}"></script>
    <script th:src="@{/js/AM003/AM003-01.js}"></script>
</div>
</html>
