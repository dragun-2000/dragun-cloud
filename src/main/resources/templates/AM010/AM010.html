<!DOCTYPE html>

<html xmlns:th="http://www.w3.org/1999/xhtml" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"

      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{template/baseManage.html}">

<div class="container-fluid" layout:fragment="main-content">

  <link rel="stylesheet" th:href="@{/css/tempusdominus-bootstrap-4.min.css}"/>

  <script th:src="@{/js/jquery-3.3.1.min.js}"></script>

  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />



  <div class="row">

    <div th:replace="~{template/sidebar :: sidebar}"></div>

    <main class="main-content col-lg-10 col-md-9 col-sm-12 p-0 offset-lg-2 offset-md-3">

      <div th:replace="~{template/navbar :: navbar}"></div>

      <div class="main-content-container container-fluid">

        <div class="page-header text-center no-gutters py-4">

          <h3 class="page-title font-weight-bold">Lịch Sử Thanh Toán</h3>

        </div>



        <div class="info-fr-1400 w-1200 mt-3">

          <form th:action="@{/AM/AM010}" method="GET" th:object="${searchCondition}">

            <div class="form-row">

              <div class="form-group col-lg-3">

                <label class="font-weight-bold">Mã đơn</label>

                <input type="text" class="form-control" th:field="*{orderCode}"/>

              </div>

              <div class="form-group col-lg-3">

                <label class="font-weight-bold">Mã VietQR</label>

                <input type="text" class="form-control" th:field="*{vietqrOrderId}"/>

              </div>

              <div class="form-group col-lg-2">

                <label class="font-weight-bold">Trạng thái</label>

                <select class="form-control" th:field="*{status}">

                  <option value="">Tất cả</option>

                  <option value="SUCCESS">SUCCESS</option>

                  <option value="FAILED">FAILED</option>

                  <option value="INFO">INFO</option>

                </select>

              </div>

              <div class="form-group col-lg-2">

                <label class="font-weight-bold">PT thanh toán</label>

                <select class="form-control" th:field="*{paymentMethod}">

                  <option value="">Tất cả</option>

                  <option value="COD">COD</option>

                  <option value="VIETQR">VIETQR</option>

                </select>

              </div>

            </div>

            <div class="text-center mt-3">

              <button type="submit" class="btn custom-btn-info mw-150">TÌM KIẾM</button>

            </div>

          </form>

        </div>



        <div class="mt-4">

          <div th:replace="~{template/pagination :: top-pagination}"></div>

        </div>



        <div class="table-log mt-3">

          <div class="card card-small mb-4">

            <div class="card-body p-0 text-center">

              <div class="table-responsive">

                <table class="table mb-0 table-bordered table-hover">

                  <thead class="bg-light">

                  <tr>

                    <th>Thời gian</th>

                    <th>Mã đơn</th>

                    <th>Mã VietQR</th>

                    <th>PT thanh toán</th>

                    <th>Trạng thái</th>

                    <th>Số tiền</th>

                    <th>Lỗi</th>

                    <th></th>

                  </tr>

                  </thead>

                  <tbody>

                  <tr th:each="row : ${orderLogs}" th:if="${totalRecord > 0}">

                    <td th:text="${#dates.format(row.lastCreated, 'yyyy-MM-dd HH:mm:ss')}"></td>

                    <td th:text="${row.orderCode}"></td>

                    <td th:text="${row.vietqrOrderId}"></td>

                    <td th:text="${row.paymentMethod}"></td>

                    <td>

                      <span th:text="${row.status}"

                            th:classappend="${row.status == 'SUCCESS'} ? 'text-success font-weight-bold' : (${row.status == 'FAILED'} ? 'text-danger font-weight-bold' : 'text-muted')"></span>

                    </td>

                    <td th:text="${row.amount}"></td>

                    <td th:text="${row.errorMessage}" style="max-width:220px;word-break:break-word;"></td>

                    <td>

                      <button type="button" class="btn btn-sm btn-info log-detail-btn"
                              th:attr="data-group-key=${row.groupKey != null ? row.groupKey : (row.orderCode != null ? row.orderCode : row.vietqrOrderId)},
                                       data-detail-log-id=${row.detailLogId}">Chi tiết</button>

                    </td>

                  </tr>

                  <tr th:if="${totalRecord == 0}">

                    <td colspan="8">Không có dữ liệu</td>

                  </tr>

                  </tbody>

                </table>

              </div>

            </div>

          </div>

          <div th:replace="~{template/pagination :: bottom-pagination}"></div>

        </div>

      </div>

    </main>

  </div>



  <div class="modal fade" id="logDetailModal" tabindex="-1">

    <div class="modal-dialog modal-lg">

      <div class="modal-content">

        <div class="modal-header">

          <h5 class="modal-title">Chi tiết log theo đơn hàng</h5>

          <button type="button" class="close" data-dismiss="modal" aria-label="Close">

            <span aria-hidden="true">&times;</span>

          </button>

        </div>

        <div class="modal-body"><pre id="log-detail-body" style="max-height:400px;overflow:auto;"></pre></div>

      </div>

    </div>

  </div>



  <script th:src="@{/js/AM010/AM010.js(v=2)}"></script>

</div>

</html>
