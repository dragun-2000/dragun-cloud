<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{template/baseManage.html}">
<div class="container-fluid" layout:fragment="main-content">

    <div class="row justify-content-center">
        <main class="col-lg-8 col-md-10">
            <div class="card mt-5 shadow-sm" style="border-top: 4px solid #dc3545;">
                <div class="card-body text-center py-5 px-4">
                    <i class="fa fa-exclamation-circle text-danger mb-3" style="font-size: 3rem;"></i>
                    <h3 class="font-weight-bold text-danger mb-3">Đã xảy ra lỗi</h3>
                    <p class="text-muted mb-4" style="font-size: 1.1rem;" th:utext="${message}"></p>
                    <hr class="my-4"/>
                    <div class="d-flex justify-content-center align-items-center flex-wrap" style="gap: 12px;">
                        <button type="button" class="btn btn-accent btn-pill" onclick="window.history.go(-1); return false;">
                            <i class="fa fa-arrow-left"></i> Quay lại
                        </button>
                        <a href="https://www.facebook.com/debase.95" target="_blank" class="btn btn-outline-primary btn-pill">
                            <i class="fa fa-facebook"></i> Liên hệ hỗ trợ
                        </a>
                    </div>
                    <p class="text-muted mt-3 mb-0" style="font-size: 0.85rem;">
                        Nếu lỗi vẫn tiếp tục, vui lòng liên hệ với chúng tôi để được hỗ trợ.
                    </p>
                </div>
            </div>
        </main>
    </div>
</div>
</html>
