<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{template/baseManage.html}">
<div class="container-fluid" layout:fragment="main-content">
    <link rel="stylesheet" th:href="@{/css/tempusdominus-bootstrap-4.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/bootstrap-select.css}" />

    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

    <div class="row">
        <div th:replace = "~{template/sidebar :: sidebar}"></div>

        <main class="main-content col-lg-10 col-md-9 col-sm-12 p-0 offset-lg-2 offset-md-3">
            <div th:replace = "~{template/navbar :: navbar}"></div>

            <div class="main-content-container container-fluid">
                <div class="page-header text-center no-gutters py-4">
                    <h3 class="page-title font-weight-bold">Quản Lý Khách Hàng</h3>
                </div>

                <div class="info-fr-1400 w-1200 mt-5" style="padding-bottom: 20px;">
                    <div class="info-form">
                        <form id="search_form" name="f" th:action="@{/AM/AM004}" method="GET"
                              th:object="${searchCondition}">
                            <div class="form-row justify-content-center">
                                <div class="form-group col-lg-12 text-center">
                                    <div class="row">
                                        <div class="col-lg-12">
                                            <div class="form-inline">
                                                <div class="col-lg-6">
                                                    <input type="text" class="form-control mr-2" th:field="*{keyword}"
                                                           placeholder="Tên Khách Hàng, Email hoặc Số Điện Thoại" style="width: inherit"/>
                                                </div>
                                                <div class="col-lg-3">
                                                    <button type="submit" class="btn custom-btn-info mw-150 search">Tìm Kiếm
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

            <div class="d-flex flex-wrap justify-content-between align-items-center mt-4">
                    <div class="form-group" style="flex: 1 0 auto">
                        <div th:replace = "~{template/pagination :: top-pagination}"></div>
                    </div>
                </div>

                <div class="box-table">
                    <input type="hidden" th:id="status" name="status" th:value="${status}"/>

                    <div class="card card-small mb-4">
                        <div class="card-body p-0 text-center">
                            <div class="table-responsive card-border">
                                <table class="table mb-0">
                                    <thead class="bg-light">
                                    <tr>
                                        <th scope="col" class="border-0 name-admin">Tên</th>
                                        <th scope="col" class="border-0">Email</th>
                                        <th scope="col" class="border-0 phone-admin">Số Điện Thoại</th>
                                        <th scope="col" class="border-0">Địa Chỉ</th>
                                        <th scope="col" class="border-0 option-admin">Tùy Chọn</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="account, item : ${accountData}" th:if="${totalRecord > 0}">
                                        <td th:text="${account.fullName}"></td>
                                        <td th:text="${account.mailAddress}"></td>
                                        <td th:text="${account.phone}"></td>
                                        <td th:text="${account.address}"></td>
                                        <td>
                                            <a class="mr-4" style="color: #22928B" th:href="@{'/AM/AM004-02/' + ${account.id}}"><i class="fas fa-user-edit"></i></a>
                                            <a th:onclick="'javascript:openDeleteOneAccountModal(' + ${account.id} + ');'" style="color: red"><i class="fas fa-trash-alt"></i></i></a>
                                        </td>

                                    </tr>
                                    <tr th:if="${totalRecord == 0}">
                                        <td colspan="14">
                                            <span>Không có Người Dùng Nào</span>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <div th:replace = "~{template/pagination :: bottom-pagination}"></div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal fade" id="delete-account-modal" tabindex="-1" role="dialog" data-backdrop="static"
         aria-labelledby="modalConfirmLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered w-450" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h6 class="col-12 modal-title text-center font-weight-bold">Xác Nhận</h6>
                </div>
                <div class="modal-body">
                    <div class="col-12 modal-title text-center mb-4">
                        Bạn có muốn tài khoản này không?
                    </div>

                    <div class="modal-footer justify-content-center border-top-0">
                        <button class="btn custom-btn-light btn-120 mr-4" type="button" role="button"
                                aria-pressed="true" data-dismiss="modal">Không
                        </button>
                        <button class="btn custom-btn-info btn-120 mr-4" type="button" role="button"
                                aria-pressed="true" id="confirm-delete-account">Xóa
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="delete-one-account-modal" tabindex="-1" role="dialog" data-backdrop="static"
         aria-labelledby="modalConfirmLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered w-450" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h6 class="col-12 modal-title text-center font-weight-bold">Xác Nhận</h6>
                </div>
                <div class="modal-body">
                    <div class="col-12 modal-title text-center mb-4">
                        Bạn có muốn Xóa tài khoản này không?
                    </div>
                    <input type="hidden" id="account-id">

                    <div class="modal-footer justify-content-center border-top-0">
                        <button class="btn custom-btn-light btn-120 mr-4" type="button" role="button"
                                aria-pressed="true" data-dismiss="modal">Không
                        </button>
                        <button class="btn custom-btn-info btn-120 mr-4" type="button" role="button"
                                aria-pressed="true" th:onclick="'javascript:deleteAccount();'">Xóa
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="delete-account-success" tabindex="-1" role="dialog" data-backdrop="static"
         aria-labelledby="modalConfirmLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered w-450" role="document">
            <div class="modal-content">
                <div class="modal-body">
                    <div  class="col-12 modal-title text-center mb-4"><i id="custom-icon" class="fas fa-check-circle"></i></div>
                    <div class="col-12 modal-title text-center mb-4">
                        Đã Xóa
                    </div>

                    <div class="modal-footer justify-content-center border-top-0">
                        <a class="btn custom-btn-info btn-120 mr-4" type="button" role="button" th:href="@{/AM/AM004}"
                           aria-pressed="true">OK
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/moment.min.js}"></script>
    <script th:src="@{/js/moment-with-locales.min.js}"></script>
    <script th:src="@{/js/tempusdominus-bootstrap-4.js}"></script>
    <script th:src="@{/js/datetimepicker.js}"></script>
    <script th:src="@{/js/bootstrap-select.min.js}"></script>
    <script th:src="@{/js/popper.min.js}"></script>
    <script th:src="@{/js/validation.common.js}"></script>
    <script th:src="@{/js/validation.js}"></script>
    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/AM004/AM004.js}"></script>
    <script th:src="@{/js/jquery-3.3.1.min.js}"></script>
    <script th:src="@{/js/jquery-ui.min.js}"></script>

    <script>
        function openDeleteOneAccountModal(id) {
            $('#delete-one-account-modal').modal('show');
            $('#account-id').val(id);
        }

        function deleteAccount() {
            var ids = [];
            ids.push($('#account-id').val());
            $.ajax({
            type: 'POST',
            contentType: "application/json",
            data: JSON.stringify(ids),
            url: '/AM/AM004/deleted',
            headers: {"X-CSRF-TOKEN": $("input[name='_csrf']").val()},
            success: function (data) {
                $('#delete-account-success').modal('show');
                $('#delete-one-account-modal').modal('hide');
            },
            error: function () {
            }
        });
        }
    </script>
</div>
</html>
