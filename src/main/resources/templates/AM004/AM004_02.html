<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.w3.org/1999/xhtml" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{template/baseManage.html}">
<div class="container-fluid" layout:fragment="main-content">
    <div class="row">

        <div th:replace = "~{template/sidebar :: sidebar}"></div>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <main class="main-content col-lg-10 col-md-9 col-sm-12 p-0 offset-lg-2 offset-md-3">
            <div th:replace = "~{template/navbar :: navbar}"></div>

            <div class="main-content-container container-fluid mt-4">
                <div class="page-header text-center no-gutters py-4 mb-4">
                    <h3 class="page-title font-weight-bold">Cài Đặt Tài Khoản Cá Nhân</h3>
                </div>
                <div>
                    <a sec:authorize="hasRole('ADMIN')" th:href="@{/AM/AM004}"><i class="far fa-arrow-alt-circle-left ml-2 mt-1 custom-back-button">&nbsp;Quay Lại</i></a>
                </div>

                <div class="alert alert-primary" role="alert" th:text="${success}" th:if="${success}"></div>
                <div class="alert alert-danger" role="alert" th:text="${failure}" th:if="${failure}"></div>
                <input id="setting" type="hidden" name="setting" th:value="*{setting}">
                <form id="update_account_form" name="f" class="needs-validation h-adr" novalidate th:object="${account}">
                    <input id="accountId" type="hidden" name="accountId" th:value="*{id}">
                    <div class="form-group row mt-3 ml-1">
                        <label for="fullName" class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Tên Tài Khoản <span class="red">※</span></label>
                        <div class="col-sm-12 col-md-9 col-lg-5 col-form-label font-weight-bold">
                            <input id="fullName" type="text" name="fullName" class="form-control form-ctrl" maxlength="255" required th:field="*{fullName}">
                            <div class="invalid-feedback">
                                yêu cầu nhập tên
                            </div>
                        </div>
                    </div>

                    <div class="form-group row ml-1">
                        <label for="mailAddress" class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Địa Chỉ Email</label>
                        <div class="col-sm-12 col-md-9 col-lg-5 col-form-label font-weight-bold">
                            <input disabled id="mailAddress" type="email" name="mailAddress" class="form-control form-ctrl" maxlength="255" required th:field="*{mailAddress}">
                            <div class="invalid-feedback">
                                Yêu cầu nhập địa chỉ email
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group row ml-1">
                        <label for="phone" class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Số Điện Thoại</label>
                        <div class="col-sm-12 col-md-9 col-lg-5 col-form-label font-weight-bold">
                            <input id="phone" type="tel" name="phone" class="form-control form-ctrl" maxlength="11" required th:field="*{phone}">
                            <div class="invalid-feedback">
                                Yêu cầu nhập số điện thoại
                            </div>
                        </div>
                    </div>

                    <div class="form-group row ml-1">
                        <label class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Mật Khẩu</label>
                        <div class="col-sm-12 col-md-9 col-lg-5 col-form-label font-weight-bold mt-2">
                            <a th:href="@{'/AM/AM001/change_password_view/' + ${account.id}}" aria-pressed="true" ><ins>Đến Màn Hình Đổi Mật Khẩu</ins></a>
                        </div>
                    </div>

                    <div style="text-align: center;">
                        <button class="btn custom-btn-info btn-120 mt-5" type="submit" id="submit-update-account" role="button" aria-pressed="true">Cập Nhập</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <div class="modal fade" id="update-account-success" tabindex="-1" role="dialog" data-backdrop="static"
         aria-labelledby="modalConfirmLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered w-450" role="document">
            <div class="modal-content">
                <div class="modal-body">
                    <div  class="col-12 modal-title text-center mb-4"><i id="custom-icon" class="fas fa-check-circle"></i></div>
                    <div class="col-12 modal-title text-center mb-4">
                        Cập Nhập Lại Thông Tin Người Dùng Thành Công
                    </div>

                    <div class="modal-footer justify-content-center border-top-0">
                        <a class="btn custom-btn-info btn-120 mr-4" th:href="@{/AM/AM004}">OK</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="update-account-error" tabindex="-1" role="dialog" data-backdrop="static"
         aria-labelledby="modalConfirmLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered w-450" role="document">
            <div class="modal-content">
                <div class="modal-body">
                    <div  class="col-12 modal-title text-center mb-4"><i class="fas fa-exclamation-triangle"></i></div>
                    <div class="col-12 modal-title text-center mb-4">
                        <label id="message-error"></label>
                    </div>

                    <div class="modal-footer justify-content-center border-top-0">
                        <button class="btn custom-btn-info btn-120 mr-4" type="button" role="button"
                                aria-pressed="true" data-dismiss="modal">OK
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/validation.common.js}"></script>
    <script th:src="@{/js/AM004/AM004-02.js}"></script>
    <script th:src="@{/js/validation.js}"></script>
</div>
</html>
