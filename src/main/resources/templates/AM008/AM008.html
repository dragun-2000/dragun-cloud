<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{template/baseManage.html}">
<div class="container-fluid" layout:fragment="main-content">
  <link rel="stylesheet" th:href="@{/css/bootstrap-select.css}" />
  <script th:src="@{/js/jquery-3.3.1.min.js}"></script>

  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

  <div class="row">
    <div th:replace = "~{template/sidebar :: sidebar}"></div>

    <main class="main-content col-lg-10 col-md-9 col-sm-12 p-0 offset-lg-2 offset-md-3">
      <div th:replace = "~{template/navbar :: navbar}"></div>

      <div class="main-content-container container-fluid">
        <div class="page-header text-center no-gutters py-4">
          <h3 class="page-title font-weight-bold">Cập Nhật Giảm Giá Sản Phẩm</h3>
        </div>

        <div class="info-fr-1400 w-1200 mt-5">
          <form id="search_form" th:action="@{/AM/AM008}" method="GET" th:object="${searchCondition}">
            <div class="form-row">
              <div class="form-group col-lg-3">
                <div class="row">
                  <label class="col-lg-5 col-form-label text-lg-right font-weight-bold">Tên Sản Phẩm</label>
                  <div class="col-lg-7">
                    <input type="text" class="form-control" th:field="*{name}"/>
                  </div>
                </div>
              </div>
              <div class="form-group col-lg-3">
                <div class="row">
                  <label class="col-lg-5 col-form-label text-lg-right font-weight-bold">Mã Sản Phẩm</label>
                  <div class="col-lg-7">
                    <input type="text" class="form-control" th:field="*{code}"/>
                  </div>
                </div>
              </div>
              <div class="form-group col-lg-3">
                <div class="row">
                  <label class="col-lg-5 col-form-label text-lg-right font-weight-bold">Mã Sản Phẩm Con</label>
                  <div class="col-lg-7">
                    <input type="text" class="form-control" th:field="*{subCode}"/>
                  </div>
                </div>
              </div>
            </div>
            <div class="text-center mt-4">
              <button type="submit" class="btn custom-btn-info mw-150 search">TÌM KIẾM</button>
            </div>
          </form>
        </div>

        <div class="card card-small mb-4 mt-4">
          <div class="card-body">
            <div class="form-row">
              <div class="form-group col-lg-4">
                <div class="row align-items-end">
                  <label class="col-lg-4 col-form-label text-lg-right font-weight-bold mb-0">Giảm Giá (%)</label>
                  <div class="col-lg-8">
                    <input type="number" id="discountInput" class="form-control" min="0.01" max="99.99" step="0.01" placeholder="Nhập % giảm giá">
                    <small class="form-text text-muted mb-0">Nhập số từ 0.01 đến 99.99</small>
                  </div>
                </div>
              </div>
              <div class="form-group col-lg-4">
                <div class="row align-items-end">
                  <label class="col-lg-4 col-form-label text-lg-right font-weight-bold mb-0">Số Sản Phẩm Đã Chọn</label>
                  <div class="col-lg-8">
                    <input type="text" id="selectedCount" class="form-control" value="0" readonly>
                    <small class="form-text text-muted mb-0" style="visibility: hidden;">Placeholder</small>
                  </div>
                </div>
              </div>
              <div class="form-group col-lg-4">
                <div class="row align-items-end">
                  <label class="col-lg-4 col-form-label text-lg-right font-weight-bold mb-0" style="visibility: hidden;">Button</label>
                  <div class="col-lg-8">
                    <button type="button" id="updateDiscountBtn" class="btn btn-primary btn-lg w-100" disabled>
                      Cập Nhật Giảm Giá
                    </button>
                    <small class="form-text text-muted mb-0" style="visibility: hidden;">Placeholder</small>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="d-flex flex-wrap justify-content-between align-items-center mt-4">
          <div class="form-group" style="flex: 1 0 auto">
            <div th:replace = "~{template/pagination :: top-pagination}"></div>
          </div>
        </div>
        <div class="table-log">
          <div class="card card-small mb-4">
            <div class="card-body p-0 text-center">
              <div class="table-responsive card-border">
                <table class="table mb-0 table-bordered table-hover">
                  <thead class="bg-light">
                  <tr>
                    <th scope="col" class="border-1 font-weight-bold" style="border-left:none !important">
                      <input type="checkbox" id="selectAll" title="Chọn tất cả">
                    </th>
                    <th scope="col" class="border-1 font-weight-bold">Mã Sản Phẩm</th>
                    <th scope="col" class="border-1 font-weight-bold">Tên Sản Phẩm</th>
                    <th scope="col" class="border-1 font-weight-bold">Giá Gốc</th>
                    <th scope="col" class="border-1 font-weight-bold">Giảm Giá (%)</th>
                    <th scope="col" class="border-1 font-weight-bold">Giá Sau Giảm</th>
                  </tr>
                  </thead>
                  <tbody>
                  <tr th:each="product : ${products}" th:if="${totalRecord > 0}">
                    <td style="border-left:none !important">
                      <input type="checkbox" class="product-checkbox" th:data-product-id="${product.id}" th:value="${product.id}">
                    </td>
                    <td th:text="${product.code}"></td>
                    <td class="text-left" th:text="${product.name}"></td>
                    <td class="text-right" th:text="${product.price}"></td>
                    <td class="text-center" th:text="${product.discount != null ? product.discount : 0}"></td>
                    <td class="text-right" th:text="${product.finalPrice != null ? product.finalPrice : product.price}"></td>
                  </tr>
                  <tr th:if="${totalRecord == 0}">
                      <td colspan="6"><span>Không có sản phẩm nào</span></td>
                  </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
          <div th:replace = "~{template/pagination :: bottom-pagination}"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Xác nhận cập nhật giảm giá -->
  <div class="modal fade" id="am008-confirm-modal" tabindex="-1" role="dialog" data-backdrop="static" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered w-450" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h6 class="col-12 modal-title text-center font-weight-bold mb-0">Xác Nhận</h6>
        </div>
        <div class="modal-body">
          <div class="col-12 modal-title text-center mb-4" id="am008-confirm-message"></div>
          <div class="modal-footer justify-content-center border-top-0">
            <button type="button" class="btn custom-btn-light btn-120 mr-4" data-dismiss="modal">Không</button>
            <button type="button" class="btn custom-btn-info btn-120" id="am008-confirm-yes">Có</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Thông báo (validation, lỗi) -->
  <div class="modal fade" id="am008-alert-modal" tabindex="-1" role="dialog" data-backdrop="static" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered w-450" role="document">
      <div class="modal-content">
        <div class="modal-body">
          <div class="col-12 modal-title text-center mb-4">
            <i class="fas fa-exclamation-circle text-warning" style="font-size: 2.5rem;"></i>
          </div>
          <div class="col-12 modal-title text-center mb-4" id="am008-alert-message"></div>
          <div class="modal-footer justify-content-center border-top-0">
            <button type="button" class="btn custom-btn-info btn-120" data-dismiss="modal">OK</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Thành công -->
  <div class="modal fade" id="am008-success-modal" tabindex="-1" role="dialog" data-backdrop="static" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered w-450" role="document">
      <div class="modal-content">
        <div class="modal-body">
          <div class="col-12 modal-title text-center mb-4">
            <i class="fas fa-check-circle text-success" style="font-size: 2.5rem;"></i>
          </div>
          <div class="col-12 modal-title text-center mb-4" id="am008-success-message">Cập nhật giảm giá thành công!</div>
          <div class="modal-footer justify-content-center border-top-0">
            <button type="button" class="btn custom-btn-info btn-120" id="am008-success-ok">OK</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Lỗi từ server -->
  <div class="modal fade" id="am008-error-modal" tabindex="-1" role="dialog" data-backdrop="static" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered w-450" role="document">
      <div class="modal-content">
        <div class="modal-body">
          <div class="col-12 modal-title text-center mb-4">
            <i class="fas fa-exclamation-triangle text-danger" style="font-size: 2.5rem;"></i>
          </div>
          <div class="col-12 modal-title text-center mb-4" id="am008-error-message"></div>
          <div class="modal-footer justify-content-center border-top-0">
            <button type="button" class="btn custom-btn-info btn-120" data-dismiss="modal">OK</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script th:src="@{/js/common.js}"></script>
  <script>
    $(document).ready(function(){
      $('#selectAll').on('change', function() {
        $('.product-checkbox').prop('checked', $(this).is(':checked'));
        updateSelectedCount();
        updateButtonState();
      });

      $(document).on('change', '.product-checkbox', function() {
        updateSelectedCount();
        updateButtonState();
        $('#selectAll').prop('checked', $('.product-checkbox:checked').length === $('.product-checkbox').length);
      });

      $('#discountInput').on('input', function() {
        updateButtonState();
      });

      function updateSelectedCount() {
        $('#selectedCount').val($('.product-checkbox:checked').length);
      }

      function updateButtonState() {
        var selectedCount = $('.product-checkbox:checked').length;
        var discountValue = parseFloat($('#discountInput').val());
        $('#updateDiscountBtn').prop('disabled', !(selectedCount > 0 && discountValue > 0 && discountValue < 100));
      }

      function showAm008Alert(message) {
        $('#am008-alert-message').text(message);
        $('#am008-alert-modal').modal('show');
      }

      function showAm008Error(message) {
        $('#am008-error-message').text(message);
        $('#am008-error-modal').modal('show');
      }

      function showAm008Confirm(message, onConfirm) {
        $('#am008-confirm-message').text(message);
        $('#am008-confirm-yes').off('click').on('click', function() {
          $('#am008-confirm-modal').modal('hide');
          onConfirm();
        });
        $('#am008-confirm-modal').modal('show');
      }

      function submitDiscountUpdate(selectedProducts, discountValue, $btn, originalText) {
        $btn.prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i> Đang xử lý...');

        $.ajax({
          url: '/AM/AM008/update-discount',
          type: 'POST',
          contentType: 'application/json',
          data: JSON.stringify({productIds: selectedProducts, discount: discountValue}),
          headers: {"X-CSRF-TOKEN": $("input[name='_csrf']").val()},
          success: function(response) {
            if (response.success) {
              $('#am008-success-modal').modal('show');
            } else {
              showAm008Error('Cập nhật thất bại: ' + (response.message || 'Lỗi không xác định'));
              $btn.prop('disabled', false).html(originalText);
              updateButtonState();
            }
          },
          error: function(xhr) {
            var errorMessage = 'Lỗi hệ thống';
            if (xhr.responseJSON && xhr.responseJSON.message) {
              errorMessage = xhr.responseJSON.message;
            }
            showAm008Error('Lỗi: ' + errorMessage);
            $btn.prop('disabled', false).html(originalText);
            updateButtonState();
          }
        });
      }

      $('#am008-success-ok').on('click', function() {
        $('#am008-success-modal').modal('hide');
        location.reload();
      });

      $('#updateDiscountBtn').on('click', function() {
        var selectedProducts = [];
        $('.product-checkbox:checked').each(function() {
          selectedProducts.push($(this).data('product-id'));
        });
        var discountValue = parseFloat($('#discountInput').val());

        if (selectedProducts.length === 0) {
          showAm008Alert('Vui lòng chọn ít nhất một sản phẩm!');
          return;
        }
        if (!discountValue || discountValue <= 0 || discountValue >= 100) {
          showAm008Alert('Vui lòng nhập % giảm giá hợp lệ (lớn hơn 0 và nhỏ hơn 100)!');
          return;
        }

        var $btn = $(this);
        var originalText = $btn.html();
        var confirmMessage = 'Bạn có chắc chắn muốn cập nhật giảm giá ' + discountValue + '% cho '
            + selectedProducts.length + ' sản phẩm đã chọn?';

        showAm008Confirm(confirmMessage, function() {
          submitDiscountUpdate(selectedProducts, discountValue, $btn, originalText);
        });
      });
    });
  </script>
</div>
</html>
