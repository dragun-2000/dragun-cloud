<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="header :: common-header"></head>
<body>
  <div class="wrapper">
    <div th:replace="header :: header"></div>

    <div class="main main--pageRegister">
        <div class="wrap">
          <div class="register-wrap">
            
            <div class="register-nav">
              <ul>
                <li>
                  <a th:href="@{/SA/SA001/login}">Login</a>
                </li>
                <li>
                  <a class="active" th:href="@{/SA/SA001/register-view}">Signup</a>
                </li>
              </ul>
            </div>
            
          <form id="register_account_form" name="f" th:object="${account}" class="needs-validation ml-3" novalidate>
            <div class="formGroup">
              <h3 class="register-title">BASIC INFO</h3>
              <p class="register-required text-right pt-2"><span class="req">*</span> Đánh dấu bắt buộc nhập</p>
              
                <div class="formGroup-item">
                  <label class="formGroup-label">
                    <span class="label-text">email<span class="req">*</span></span>
                    <span class="label-character">(Dùng cho nhận thông báo)</span>
                  </label>
                  <div class="formGroup-control">
                    <input id="mailAddress" type="email" name="mailAddress" class="form-control form-ctrl" required>
                    <div class="invalid-feedback mailAddress-error">
                        Vui lòng nhập địa chỉ email
                    </div>
                  </div>
                </div>
                <div class="formGroup-item">
                  <label class="formGroup-label">
                    <span class="label-text">Password<span class="req">*</span></span>
                    <span class="label-character">(8~20 Kí tự)</span>
                  </label>
                  <div class="formGroup-control">
                    <input id="password" class="form-control" type="password" name="password" placeholder="" minlength="8" maxlength="20" required>
                    <div class="invalid-feedback">
                        Vui lòng nhập mật khẩu ít nhất 8 kí tự
                    </div>
                  </div>

                </div>
                <div class="formGroup-item">
                  <label class="formGroup-label">
                    <span class="label-text">Password Confirm<span class="req">*</span></span>
                  </label>
                  <div class="formGroup-control">
                    <input id="confirmPassword" type="password" name="confirmPassword" class="form-control form-ctrl input" minlength="8" maxlength="20" placeholder="Nhập lại mật khẩu" required>
                    <div class="invalid-feedback password-error">
                        Vui lòng nhập lại mật khẩu ít nhất 8 kí tự
                    </div>
                  </div>
                </div>
                <div class="formGroup-item">
                  <label class="formGroup-label">
                    <span class="label-text">FullName<span class="req">*</span></span>
                  </label>
                  <div class="formGroup-control">
                    <input id="fullName" type="text" name="fullName" class="form-control form-ctrl" maxlength="100" required>
                    <div class="invalid-feedback">
                        Vui lòng nhập tên của bạn
                    </div>
                  </div>
                </div>
                <div class="formGroup-item">
                  <label class="formGroup-label">
                    <span class="label-text">Phone<span class="req">*</span></span>
                  </label>
                  <div class="formGroup-control">
                    <input id="phone" type="text" name="phone" class="form-control form-ctrl" maxlength="11" required>
                    <div class="invalid-feedback">
                        Vui lòng nhập số điện thoại của bạn
                    </div>
                  </div>
                </div>
                <div class="formGroup-item">
                  <label class="formGroup-label">
                    <span class="label-text">Address<span class="req">*</span></span>
                  </label>
                  <div class="formGroup-control">
                    <div class="bank">
                      <p class="bank-text">Province</p>
                      <select class="form-control" id="provinceSelect" name="province" required>
                        <option value="" selected="selected">- District -</option>
                        <option th:each="province : ${provinces}" th:value="${province.code}" th:text="${province.name}"></option>
                      </select>
                    </div>
                    <div class="bank">
                      <p class="bank-text">District</p>
                      <select class="form-control" id="districtSelect" name="district" required>
                        <option value="" selected="selected">- Select District -</option>
                      </select>
                    </div>
                    <div class="bank">
                      <p class="bank-text">Ward</p>
                      <select class="form-control" id="wardSelect" name="ward" required>
                        <option value="" selected="selected">- Select Ward -</option>
                      </select>
                    </div>
                    <div class="bank">
                      <p class="bank-text">Floor</p>
                      <input class="form-control" type="text" placeholder="Floor / house number ..." name="address" id="address">
                    </div>
                  </div>
                </div>
              
                </div>
                <div class="btnRegister">
                  <button class="btn btn-info" type="submit">SIGN IN</button>
                </div>
            </form>
          </div>
          
          <div class="modal fade" id="register-account-success" tabindex="-1" role="dialog" data-backdrop="static"
             aria-labelledby="modalConfirmLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered w-450" role="document">
                <div class="modal-content">
                    <div class="modal-body">
                        <div  class="col-12 modal-title text-center mb-4"><i id="custom-icon" class="fas fa-check-circle"></i></div>
                        <div class="col-12 modal-title text-center mb-4">
                            <label id="message-success"></label>
                        </div>
    
                        <div class="modal-footer justify-content-center border-top-0">
                            <a class="btn custom-btn-info btn-120 mr-4" th:href="@{/SA/SA001/login}"
                               aria-pressed="true" id="">OK
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    
        <div class="modal fade" id="register-account-error" tabindex="-1" role="dialog" data-backdrop="static"
             aria-labelledby="modalConfirmLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered w-450" role="document">
                <div class="modal-content">
                    <div class="modal-body">
                        <div  class="col-12 modal-title text-center mb-4"><i class="fas fa-exclamation-triangle"></i></div>
                        <div class="col-12 modal-title text-center mb-4">
                            <label id="message-error"></label>
                        </div>
    
                        <div class="modal-footer justify-content-center border-top-0">
                            <button class="btn custom-btn-info btn-120 mr-4" type="button" role="button"
                                    aria-pressed="true" data-dismiss="modal">OK
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    
        </div>
    </div><!--/main -->

    <div th:replace="header :: footer"></div>
  </div><!--/wrapper -->
  
    <script th:src="@{/js/signup/signup.js}"></script>
</body>
</html>
