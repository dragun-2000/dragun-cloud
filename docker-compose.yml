version: '3.8'

services:
  debase-app:
    build: .
    environment:
      # POSTGRES_DB below is "debase"; init/*.sql runs against that database.
      SPRING_DATASOURCE_URL: jdbc:postgresql://debase-db:5432/debase
      SPRING_DATASOURCE_USERNAME: dragun
      SPRING_DATASOURCE_PASSWORD: Picachu@123
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      # Ép JVM dùng IPv4 (curl trong container dùng IPv4 → OK; Java mặc định có thể thử IPv6 → timeout 443)
      JAVA_TOOL_OPTIONS: "-XX:-UseContainerSupport -Djava.net.preferIPv4Stack=true"
      # Brevo: API key từ tab "API keys & MCP" (đặt trong .env: BREVO_API_KEY=...)
      BREVO_API_KEY: ${BREVO_API_KEY:-}

      # VNPAY (đặt giá trị trong .env cạnh docker-compose.yml, KHÔNG commit). Chi tiết: application-*.properties mục VNPAY.
      # Mặc định đang trỏ môi trường TEST (sandbox); production phải override TMN_CODE / PAY_URL / API_URL.
      VNPAY_ENABLED: ${VNPAY_ENABLED:-true}
      # vnp_TmnCode — email kết nối VNPAY (test: NTHTEST1)
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-NTHTEST1}
      # vnp_HashSecret — bắt buộc trong .env (file zip VNPAY). Chuỗi rỗng → VNPAY ẩn trên UI.
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      # Test: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html — Production: VNPAY cấp khi go-live
      VNPAY_PAY_URL: ${VNPAY_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      # Test: https://sandbox.vnpayment.vn/merchant_webapi/api/transaction — Production: VNPAY cấp khi go-live
      VNPAY_API_URL: ${VNPAY_API_URL:-https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      # Return URL public (sandbox test dùng debase.vn). IPN đăng ký riêng với KT VNPAY: https://debase.vn/vnpay/ipn
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-https://debase.vn/vnpay/return}

      # MinIO configuration (thay cho AWS S3)
      # MINIO_ENDPOINT: http://debase-minio:9000
      # MINIO_ACCESS_KEY: dragun
      # MINIO_SECRET_KEY: Picachu@123
      # MINIO_BUCKET: dragun-bucket
      # MINIO_REGION: us-east-1

    ports:
      - "8085:8085"
    depends_on:
      - debase-db
      # - debase-minio
    volumes:
      - /var/www/html/external-images:/var/www/html/external-images
      - ./config:/app/config
      - ./log:/app/log

  debase-db:
    image: postgres:15
    environment:
      POSTGRES_USER: dragun
      POSTGRES_PASSWORD: Picachu@123
      POSTGRES_DB: debase
    ports:
      # Host 5433 avoids clashing with a local Postgres already on 5432 (Windows). Container still listens on 5432.
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d

  # debase-pgadmin:
  #   image: dpage/pgadmin4:latest
  #   restart: always
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@local.com
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     - debase-db

  # debase-minio:
  #   image: minio/minio:latest
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: dragun
  #     MINIO_ROOT_PASSWORD: Picachu@123
  #   ports:
  #     - "9000:9000"  # API
  #     - "9001:9001"  # Web console
  #   volumes:
  #     - minio_data:/data

volumes:
  postgres_data:
  # minio_data: