version: '3.8'

services:
  debase-app:
    build: .
    environment:
      SPRING_REDIS_HOST: debase-redis
      SPRING_REDIS_PORT: 6379
      SPRING_DATASOURCE_URL: jdbc:postgresql://debase-db:5432/postgres
      SPRING_DATASOURCE_USERNAME: dragun
      SPRING_DATASOURCE_PASSWORD: Picachu@123
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      # Ép JVM dùng IPv4 (curl trong container dùng IPv4 → OK; Java mặc định có thể thử IPv6 → timeout 443)
      JAVA_TOOL_OPTIONS: "-XX:-UseContainerSupport -Djava.net.preferIPv4Stack=true"
      # Brevo: API key từ tab "API keys & MCP" (đặt trong .env: BREVO_API_KEY=...)
      BREVO_API_KEY: ${BREVO_API_KEY:-}

      # MinIO configuration (thay cho AWS S3)
      # MINIO_ENDPOINT: http://debase-minio:9000
      # MINIO_ACCESS_KEY: dragun
      # MINIO_SECRET_KEY: Picachu@123
      # MINIO_BUCKET: dragun-bucket
      # MINIO_REGION: us-east-1

    ports:
      - "8085:8085"
    depends_on:
      - debase-db
      - debase-redis
      # - debase-minio
    volumes:
      - /var/www/html/external-images:/var/www/html/external-images
      - ./config:/app/config
      - ./log:/app/log

  debase-db:
    image: postgres:15
    environment:
      POSTGRES_USER: dragun
      POSTGRES_PASSWORD: Picachu@123
      POSTGRES_DB: debase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d

  debase-redis:
    image: redis:7
    ports:
      - "6379:6379"

  # debase-pgadmin:
  #   image: dpage/pgadmin4:latest
  #   restart: always
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@local.com
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     - debase-db

  # debase-minio:
  #   image: minio/minio:latest
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: dragun
  #     MINIO_ROOT_PASSWORD: Picachu@123
  #   ports:
  #     - "9000:9000"  # API
  #     - "9001:9001"  # Web console
  #   volumes:
  #     - minio_data:/data

volumes:
  postgres_data:
