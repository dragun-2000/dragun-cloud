<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<div class="pagination-responsive row" th:if="${totalRecord > 0}" th:fragment="top-pagination">
    <div class="col-auto ml-auto">
        <div class="row">
            <div class="col-auto paging-info">
                <span class="text-right">
                    <b>Hiển thị: [[${page * size + 1}]] ~ [[${size * (page + 1) < totalRecord} ? ${size * (page + 1)} : ${totalRecord}]] Bản Ghi
                        / Tổng Số Bản ghi là:&nbsp; [[${totalRecord}]] </b>
                </span>
            </div>
<!--            <div class="col-auto">-->
<!--                <select class="form-control" onchange="location.href = this.value;">-->
<!--                    <option th:value="${listUrl + pageSizeMaps + '&size=10'}" th:selected="${size==10}">10</option>-->
<!--                    <option th:value="${listUrl + pageSizeMaps + '&size=20'}" th:selected="${size==20}">20</option>-->
<!--                    <option th:value="${listUrl + pageSizeMaps + '&size=30'}" th:selected="${size==30}">30</option>-->
<!--                    <option th:value="${listUrl + pageSizeMaps + '&size=50'}" th:selected="${size==50}">50</option>-->
<!--                    <option th:value="${listUrl + pageSizeMaps + '&size=100'}" th:selected="${size==100}">100</option>-->
<!--                </select>-->
<!--            </div>-->
        </div>
    </div>
</div>

<nav aria-label="Page navigation example" th:if="${totalRecord > 0}" th:fragment="bottom-pagination">
    <ul class="pagination justify-content-center">
        <li class="page-item" th:classappend="${page==0} ? disabled : ''">
            <a class="page-link" th:href="@{${listUrl + conditionMaps}(page = 0, size = ${size}, sort = ${sort})}" aria-label="Trang Đầu">
                <span aria-hidden="true">Trang Đầu</span>
                <span class="sr-only">Trước</span>
            </a>
        </li>
        <li class="page-item" th:classappend="${page==0} ? disabled : ''">
            <a class="page-link" th:href="@{${listUrl + conditionMaps}(page = ${page -1}, size = ${size}, sort = ${sort})}" aria-label="Trước">
                <span aria-hidden="true">Trước</span>
                <span class="sr-only">Sau</span>
            </a>
        </li>

        <span th:if="${page - 4 > 0 }" class="mx-1">...</span>

        <li class="page-item" th:each="pageNumber: ${pageNumbers}" th:if="${((page - 4) < pageNumber && pageNumber < (page + 6))}" th:classappend="${pageNumber==page + 1} ? active">
            <a class="page-link" th:unless="${pageNumber==page + 1}"
               th:href="@{${listUrl + conditionMaps}(page = ${pageNumber -1}, size = ${size}, sort = ${sort})}" th:text="${pageNumber}">
            </a>
            <a class="page-link" th:if="${pageNumber==page + 1}"
               th:text="${pageNumber}">
            </a>
        </li>

        <span th:if="${ (page + 1) < totalPages - 4}" class="mx-1">...</span>

        <li class="page-item" th:classappend="${page==(totalPages - 1)} ? disabled : ''">
            <a class="page-link" th:href="@{${listUrl + conditionMaps}(page = ${page + 1}, size = ${size}, sort = ${sort})}" aria-label="Sau">
                <span aria-hidden="true">Sau</span>
                <span class="sr-only">Sau</span>
            </a>
        </li>
        <li class="page-item" th:classappend="${page==(totalPages - 1)} ? disabled : ''">
            <a class="page-link" th:href="@{${listUrl + conditionMaps}(page = ${totalPages - 1}, size = ${size}, sort = ${sort})}" aria-label="Trang Cuối">
                <span aria-hidden="true">Trang Cuối</span>
                <span class="sr-only">Trang Cuối</span>
            </a>
        </li>
    </ul>
</nav>
</html>
