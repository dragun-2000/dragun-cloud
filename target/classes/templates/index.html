<!doctype html>
<html xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
      
<head th:replace="header :: common-header"></head>
<body>
  <div class="wrapper">
    <div th:replace="header :: navbar"></div>
    <div th:replace="header :: header"></div>

    <div class="main main--pageHome">
      <div class="wrap">
        <div class="groupProducts" th:if="${newInProducts.size() > 0}">
          <div class="title">
            <h2 class="title-tlt text-shadow-bold text-responsive">NEW IN</h2>
          </div>

          <div class="products-list">
            <ul class="list-style-none" >
              <li th:each="product : ${newInProducts}">
                <a class="products-inner" th:href="@{/products(id=${product.id})}">
                  <div class="products-thumb">
                    <div class="thumbnail">
                      <img th:src="${product.image}" alt="Product Image">
                    </div>
                  </div>
                  <div class="products-content">
                    <h3 class="products-title" th:text="${product.name}"></h3>
                    <h3 th:if="${product.outStock}" style="color: red;">(Hết Hàng)</h3>
                    <del th:if="${product.hasDiscount}" class="products-price" th:text="${product.priceDisplay} + VND"></del>
                    <p th:style="${product.hasDiscount} ? 'color: red;' : ''" class="price-standard"><span class="price" th:text="${product.discountPriceDisplay} + VND"></span></p>
                    <div class="products-color">
                      <span th:each="color : ${product.codeColors}" th:style="'background:' + ${color}"></span>
                    </div>
                  </div>
                </a>
              </li>
            </ul>
          </div>
          
          <div class="more-view">
            <a type="button" class="btn btn-outline-secondary" th:href="@{/products/group/NEW IN}">
              <span class="btn-text">MORE DETAIL</span>
            </a>
          </div>
        </div>
        
        <div class="groupProducts" th:if="${products.size() > 0}">
          <div class="title">
            <h2 class="title-tlt text-shadow-bold text-responsive">ALL PRODUCTS</h2>
          </div>

          <div class="products-list">
            <ul class="list-style-none" >
              <li th:each="product : ${products}">
                <a class="products-inner" th:href="@{/products(id=${product.id})}">
                  <div class="products-thumb">
                    <div class="thumbnail">
                      <img th:src="${product.image}" alt="Product Image">
                    </div>
                  </div>
                  <div class="products-content">
                    <h3 class="products-title" th:text="${product.name}"></h3>
                    <h3 th:if="${product.outStock}" style="color: red;">(Hết Hàng)</h3>
                    <del th:if="${product.hasDiscount}" class="products-price" th:text="${product.priceDisplay} + VND"></del>
                    <p th:style="${product.hasDiscount} ? 'color: red;' : ''" class="price-standard"><span class="price" th:text="${product.discountPriceDisplay} + VND"></span></p>
                    <div class="products-color">
                      <span th:each="color : ${product.codeColors}" th:style="'background:' + ${color}"></span>
                    </div>
                  </div>
                </a>
              </li>
            </ul>
          </div>
          
          <div class="more-view">
            <a type="button" class="btn btn-outline-secondary" th:href="@{/products/group/ALL PRODUCTS}">
              <span class="btn-text">MORE DETAIL</span>
            </a>
          </div>
        </div>
      </div>
    </div><!--/main -->

    <div th:replace="header :: footer"></div>
  </div><!--/wrapper -->
</body>
</html>
