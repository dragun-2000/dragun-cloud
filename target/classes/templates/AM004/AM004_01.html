<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{template/baseManage.html}">
<div class="container-fluid" layout:fragment="main-content">
    <div class="row">

        <div th:replace = "~{template/sidebar :: sidebar}"></div>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <main class="main-content col-lg-10 col-md-9 col-sm-12 p-0 offset-lg-2 offset-md-3">
            <div th:replace = "~{template/navbar :: navbar}"></div>

            <div class="main-content-container container-fluid mt-4">
                <div class="page-header text-center no-gutters py-4 mb-4">
                    <h3 class="page-title font-weight-bold">Đăng Kí Tài Khoản</h3>
                </div>
                <div>
                    <a onclick="window.history.go(-2); return false;" ><i class="far fa-arrow-alt-circle-left ml-2 mt-1 custom-back-button">&nbsp;Quay Lại</i></a>
                </div>

                <form id="register_account_form" name="f" th:object="${account}" class="needs-validation ml-3" novalidate>
                    <div class="form-group row">
                        <label for="fullName" class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Tên <span class="red">※</span></label>
                        <div class="col-sm-12 col-md-9 col-lg-7 col-xl-6 col-form-label font-weight-bold">
                            <input id="fullName" type="text" name="fullName" class="form-control form-ctrl" maxlength="255" th:value="*{fullName}" th:field="*{fullName}" required
                                   oninput="checkFormRegistrationAccount();">
                            <div class="invalid-feedback">
                                氏名を入力してください。
                            </div>
                        </div>
                    </div>

                    <div class="form-group row">
                        <label for="mailAddress" class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Email <span class="red">※</span></label>
                        <div class="col-sm-12 col-md-9 col-lg-7 col-xl-6 col-form-label font-weight-bold">
                            <input id="mailAddress" type="email" name="mailAddress" class="form-control form-ctrl" required
                                   oninput="checkFormRegistrationAccount();">
                            <div class="invalid-feedback mailAddress-error">
                                メールアドレスを入力してください。
                            </div>
                        </div>
                    </div>
                    <div class="form-group row" th:if="*{id == null}">
                        <label for="password" class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Mật Khẩu <span class="red">※</span></label>
                        <div class="col-sm-12 col-md-9 col-lg-7 col-xl-6 col-xxl-5  col-form-label font-weight-bold">
                            <input id="password" type="password" name="password" class="form-control form-ctrl input" min="8"
                                   placeholder="パスワードは8~20文字以内半角英字と半角数字と半角記号の3種類混合で入力してください。" required
                                   oninput="checkFormRegistrationAccount();">
                            <div class="invalid-feedback password-error">
                                Mật Khẩu Nhập Không Hợp Lệ
                            </div>
                        </div>
                    </div>

                    <div class="form-group row" th:if="*{id == null}">
                        <label for="password" class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Mật Kẩu（Nhập Lại) <span class="red">※</span></label>
                        <div class="col-sm-12 col-md-9 col-lg-7 col-xl-6 col-form-label font-weight-bold">
                            <input id="confirmPassword" type="password" name="confirmPassword" class="form-control form-ctrl" min="8" required
                                   oninput="checkFormRegistrationAccount();">
                            <div class="invalid-feedback confirmPassword-error">
                                Mật Khẩu Nhập Lại Không đúng
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group row" th:if="*{id == null}">
                        <label class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="margin: 8px; max-width: 180px;">Loại Tài Khoản<span class="red">※</span></label>
                        <div class="col-sm-12 col-md-9 col-lg-7 col-xl-6 col-form-label font-weight-bold">
                            <select th:field="*{authorities}" name="authorities" class="form-control form-ctrl" required>
                                <option value="3">Nhân Viên</option>
                                <option value="2">Người Dùng</option>
                            </select>
                        </div>
                    </div>
                    <div style="text-align: center;">
                        <button class="btn custom-btn-info btn-120 mt-5" type="submit" role="button" aria-pressed="true">Tạo Tài Khoản 
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <div class="modal fade" id="register-account-success" tabindex="-1" role="dialog" data-backdrop="static"
         aria-labelledby="modalConfirmLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered w-450" role="document">
            <div class="modal-content">
                <div class="modal-body">
                    <div  class="col-12 modal-title text-center mb-4"><i id="custom-icon" class="fas fa-check-circle"></i></div>
                    <div class="col-12 modal-title text-center mb-4">
                        <label id="message-success"></label>
                    </div>

                    <div class="modal-footer justify-content-center border-top-0">
                        <a class="btn custom-btn-info btn-120 mr-4" th:href="@{/AM/AM004}"
                           aria-pressed="true" id="">OK
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="register-account-error" tabindex="-1" role="dialog" data-backdrop="static"
         aria-labelledby="modalConfirmLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered w-450" role="document">
            <div class="modal-content">
                <div class="modal-body">
                    <div  class="col-12 modal-title text-center mb-4"><i class="fas fa-exclamation-triangle"></i></div>
                    <div class="col-12 modal-title text-center mb-4">
                        <label id="message-error"></label>
                    </div>

                    <div class="modal-footer justify-content-center border-top-0">
                        <button class="btn custom-btn-info btn-120 mr-4" type="button" role="button"
                                aria-pressed="true" data-dismiss="modal">OK
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/validation.common.js}"></script>
    <script th:src="@{/js/AM004/AM004-01.js}"></script>
</div>
</html>
