<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.w3.org/1999/xhtml" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{template/baseManage.html}">
<div id="wrapper" class="container-fluid" layout:fragment="main-content">
    <div class="row">
        <div th:replace = "~{template/sidebar :: sidebar}"></div>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <main class="main-content col-lg-10 col-md-9 col-sm-12 p-0 offset-lg-2 offset-md-3">
            <div th:replace = "~{template/navbar :: navbar}"></div>
            <a class="navbar-brand w-100 mr-0 p-0" th:href="@{/}"></a>

            <div class="from-group-row container-fluid text-center">
                <div class="page-header text-center no-gutters py-4 mb-4">
                    <h3 class="page-title font-weight-bold">Màn Hình Đổi Mật Khẩu</h3>
                </div>
                <div th:if="!*{setting}" class="text-left">
                    <a th:href="@{'/AM/AM004-02/' + ${changePassword.accountId}}" class="ml-2 mt-1 custom-back-button"><i
                            class="far fa-arrow-alt-circle-left"></i>&nbsp;Quay Lại</a>
                </div>

                <div th:if="*{setting}" class="text-left">
                    <a th:href="@{/AM/AM004-02}" class="ml-2 mt-1 custom-back-button"><i
                            class="far fa-arrow-alt-circle-left"></i>&nbsp;Quay Lại</a>
                </div>

                <input type="hidden" id="setting" name="setting" th:value="*{setting}"/>
                <form id="form-change-password" name="f" th:object="${changePassword}" class="needs-validation mx-1" novalidate>
                    <input type="hidden" th:value="*{accountId}" name="accountId"/>

                    <div th:if="${setting}" class="form-group row align-items-center mt-3 ml-3 text-left">
                        <label for="oldPassword" class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="max-width: 180px;">Mật Khẩu Hiện Tại<span class="red">※</span></label>
                        <div class="col-sm-12 col-md-9 col-lg-5 col-form-label font-weight-bold">
                            <div class="input-group" id="show_hide_password">
                                <input id="oldPassword" type="password" class="password form-control form-ctrl" th:field="*{oldPassword}" name="oldPassword" min="8" required
                                oninput="checkConfirmPasswordSetting()"/>
                                <div class="input-group-append">
                                    <span class="input-group-text"><i class="fa fa-eye-slash" aria-hidden="true"></i></span>
                                </div>
                                <div class="invalid-feedback oldPassword-error">
                                    Mật Khẩu Hiện Tại Không Chính Xác
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group row mt-3 ml-3 align-items-center text-left">
                        <label for="newPassword" class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="max-width: 180px;">Mật Khẩu Mới<span class="red">※</span></label>
                        <div class="col-sm-12 col-md-9 col-lg-5 col-form-label font-weight-bold">
                            <div class="input-group" id="show_hide_newPassword">
                                <input id="newPassword" type="password" class="password form-control form-ctrl" th:field="*{newPassword}" name="newPassword" min="8" required
                                       oninput="checkConfirmPasswordSetting()"/>
                                <div class="input-group-append">
                                    <span class="input-group-text"><i class="fa fa-eye-slash" aria-hidden="true"></i></span>
                                </div>
                                <div class="invalid-feedback newPassword-error">
                                    Mật Khẩu Mới Giông Mật Khẩu Hiện Tại
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group row mt-3 ml-3 align-items-center text-left">
                        <label for="confirmPassword" class="col-sm-12 col-md-3 col-lg-2 col-form-label font-weight-bold" style="max-width: 180px;">Nhập Lại Khẩu Mới<span class="red">※</span></label>
                        <div class="col-sm-12 col-md-9 col-lg-5 col-form-label font-weight-bold">
                            <div class="input-group" id="show_hide_confirmPassword">
                                <input id="confirmPassword" type="password" class="password form-control form-ctrl" th:field="*{confirmPassword}" name="confirmPassword" min="8" required
                                       oninput="checkConfirmPasswordSetting()"/>
                                <div class="input-group-append">
                                    <span class="input-group-text"><i class="fa fa-eye-slash" aria-hidden="true"></i></span>
                                </div>
                                <div class="invalid-feedback confirmPassword-error">
                                    Mật Khẩu Xác Nhận Không Đúng
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="text-center mt-4">
                        <button type="submit" class="btn custom-btn-info mw-200">Xác Nhận</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <div class="modal fade" id="change-password-success" tabindex="-1" role="dialog" data-backdrop="static"
         aria-labelledby="modalConfirmLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered w-450" role="document">
            <div class="modal-content">
                <div class="modal-body">
                    <div  class="col-12 modal-title text-center mb-4"><i id="custom-icon" class="fas fa-check-circle"></i></div>
                    <div class="col-12 modal-title text-center mb-4">
                        Thay Đổi Mật Khẩu Mới Thành Công
                    </div>

                    <div class="modal-footer justify-content-center border-top-0">
                        <a class="btn custom-btn-info btn-120 mr-4" aria-pressed="true" data-dismiss="modal">OK</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="change-password-error" tabindex="-1" role="dialog" data-backdrop="static"
         aria-labelledby="modalConfirmLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered w-450" role="document">
            <div class="modal-content">
                <div class="modal-body">
                    <div  class="col-12 modal-title text-center mb-4"><i class="fas fa-exclamation-triangle"></i></div>
                    <div class="col-12 modal-title text-center mb-4">
                        <label id="message-error"></label>
                    </div>

                    <div class="modal-footer justify-content-center border-top-0">
                        <button class="btn custom-btn-info btn-120 mr-4" type="button" role="button"
                                aria-pressed="true" data-dismiss="modal">OK
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/js/AM001/AM001_03.js}"></script>
    <script th:src="@{/js/validation.common.js}"></script>
    <script>

        var input = $("#show_hide_password input");
        var icon = $("#show_hide_password i");

        icon.on('click', function (event) {
            event.preventDefault();
            if (input.attr("type") === "text") {
                input.attr('type', 'password');
                icon.addClass("fa-eye-slash");
                icon.removeClass("fa-eye");

            } else if (input.attr("type") === "password") {
                input.attr('type', 'text');
                icon.removeClass("fa-eye-slash");
                icon.addClass("fa-eye");
            }
        });

        var input_newPassword = $("#show_hide_newPassword input");
        var icon_newPassword = $("#show_hide_newPassword i");

        icon_newPassword.on('click', function (event) {
            event.preventDefault();
            if (input_newPassword.attr("type") === "text") {
                input_newPassword.attr('type', 'password');
                icon_newPassword.addClass("fa-eye-slash");
                icon_newPassword.removeClass("fa-eye");

            } else if (input_newPassword.attr("type") === "password") {
                input_newPassword.attr('type', 'text');
                icon_newPassword.removeClass("fa-eye-slash");
                icon_newPassword.addClass("fa-eye");
            }
        });

        var input_confirmPassword = $("#show_hide_confirmPassword input");
        var icon_confirmPassword = $("#show_hide_confirmPassword i");

        icon_confirmPassword.on('click', function (event) {
            event.preventDefault();
            if (input_confirmPassword.attr("type") === "text") {
                input_confirmPassword.attr('type', 'password');
                icon_confirmPassword.addClass("fa-eye-slash");
                icon_confirmPassword.removeClass("fa-eye");

            } else if (input_confirmPassword.attr("type") === "password") {
                input_confirmPassword.attr('type', 'text');
                icon_confirmPassword.removeClass("fa-eye-slash");
                icon_confirmPassword.addClass("fa-eye");
            }
        });
    </script>

    <script th:inline="javascript">
        /*<![CDATA[*/
        var accountId = /*[[${changePassword.accountId}]]*/ 'default';
        $( document ).ready(function() {
            $('#change-password-success').on('hide.bs.modal', function (e) {
              location.href = '/AM/AM004-02/' + accountId;
            });
        });
        /*]]>*/
    </script>
</div>
</html>
