<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="header :: common-header"></head>
<body>
<div class="wrapper">
  <div th:replace="header :: header"></div>

  <div class="main main--pageCart">
    <div hidden ><input id="orderItems-default" th:value="${orderItems}"></div>
    <div class="wrap wrap--mw900">
      <div id="cart-info">
      </div>

      <div class="order-totalsummary">
        <div class="order-cart">
          <ul>
            <li>
              <span class="order-label">PRODUCT</span>
              <span id="total-bill-temp" class="order-text" th:text="${totalPrice} + VND"></span>
            </li>
            <li class="order-total">
              <span class="order-label">SUBTOTAL</span>
              <span id="total-bill" class="order-text" th:text="${totalPrice} + VND"></span>
            </li>
          </ul>
        </div>
        <div class="naver">
          <div class="npay">
            <div class="npay-text">
              <span class="">ORDER</span>Nhập Thông Tin Thanh Toán
            </div>
            <div class="npay-btn">
              <a class="btn btn-success" onclick="order()" >ORDER DETAIL</a>
            </div>
          </div>
          <div class="slider slider-news">
          </div>
        </div>
      </div>
    </div>

  </div><!--/main -->

  <div class="popup" id="removeToCardFail">
    <div class="popup-content">
      <h2>Đã có lỗi sảy ra vui lòng th lại!</h2>
      <button class="close-btn fail" onclick="closePopup('removeToCardFail')">Đóng</button>
    </div>
  </div>

  <div id="notification" class="notification">
    <span id="notification-message"></span>
  </div>

  <div th:replace="header :: footer"></div>
</div><!--/wrapper -->

  <script src="/js/cart/cart-detail.js"></script>

<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f4f4f4;
  }

  /* Pop-up sẽ được đặt cố định, không ảnh hưởng đến layout của các phần tử khác */
  .popup {
    display: none; /* Ẩn popup mặc định */
    position: fixed; /* Đặt pop-up cố định */
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5); /* Nền mờ cho pop-up */
    justify-content: center;
    align-items: center;
    z-index: 9999; /* Đảm bảo pop-up nằm trên các phần tử khác */
  }

  .popup-content {
    background-color: #fff;
    border-radius: 10px;
    padding: 30px;
    text-align: center;
    width: 300px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  }

  .popup-content h2 {
    font-size: 24px;
  }

  .popup-content p {
    font-size: 16px;
    color: #333;
  }

  .close-btn {
    background-color: #28a745; /* Màu xanh cho thành công */
    color: white;
    border: none;
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    border-radius: 5px;
    margin-top: 20px;
  }

  .close-btn.fail {
    background-color: #dc3545; /* Màu đỏ cho thất bại */
  }

  .close-btn:hover {
    background-color: #218838;
  }

  .close-btn.fail:hover {
    background-color: #c82333;
  }
  .notification {
    position: fixed;
    bottom: 20px; /* Cách mép dưới 20px */
    right: 20px; /* Cách mép phải 20px */
    color: #fff;
    padding: 15px 20px;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    opacity: 0;
    transform: translateY(50px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    z-index: 9999;
    font-size: 16px;
  }

  /* Hiển thị thông báo */
  .notification.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* Thông báo thành công */
  .notification.success {
    background-color: #28a745; /* Màu xanh */
  }

  /* Thông báo lỗi */
  .notification.error {
    background-color: #dc3545; /* Màu đỏ */
  }

  /* Nút đóng */
  .notification .close-btn {
    background: none;
    border: none;
    color: white;
    font-size: 16px;
    cursor: pointer;
    position: absolute;
    top: 8px;
    right: 10px;
  }
</style>
</body>
</html>
