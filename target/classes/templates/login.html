<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="header :: common-header"></head>
<body>
<div class="wrapper">
  <div th:replace="header :: header"></div>

  <div class="main main--pageRegister">
    <div class="wrap">
      <div class="register-wrap">
        <div class="register-nav">
          <ul>
            <li>
              <a class="active" th:href="@{/SA/SA001/login}">Login</a>
            </li>
            <li>
              <a th:href="@{/SA/SA001/register-view}">Signup</a>
            </li>
          </ul>
        </div>
        <div class="formGroup">
          <form name="login" class="needs-validation" th:action="@{/SA/SA001/login}" method="POST" novalidate>
            <div class="form-group row mt-4" th:if="${param.error}">
              <div class="col-sm-3">&#8203;</div>
              <div class="col-sm-9">
                <div class="alert alert-danger">
                  Thông tin tài khoản sai!
                </div>
              </div>
            </div>
            <div class="formGroup-item">
              <label class="formGroup-label">
                <span class="label-text">PHONE</span>
<!--                <span class="label-character">아이디찾기</span>-->
              </label>
              <div class="formGroup-control">
                <input class="form-control" type="text" id="username" required name="username" value="" autofocus>
                <div class="invalid-feedback username-error">
                  Nhập sai định dạng email
                </div>
              </div>
            </div>
            <div class="formGroup-item">
              <label class="formGroup-label">
                <span class="label-text">PASSWORD</span>
<!--                <span class="label-character">비밀번호 찾기</span>-->
              </label>
              <div class="formGroup-control">
                <input class="form-control" type="password" id="password" required name="password">
                <div class="invalid-feedback pass-error">
                  Nhập sai định dạng mật khẩu
                </div>
              </div>
            </div>
            <div class="btnRegister">
              <button type="submit" role="button" aria-pressed="true" class="btn btn-dark">LOGIN</button>
            </div>
          </form>
        </div>
        <div class="btnRegister pt-2">
          <a type="button" class="btn btn-dark" th:href="@{/SA/SA002/forget-password}">Forgot Password</a>
        </div>
      </div>
    </div>
  </div><!--/main -->

  <div th:replace="header :: footer"></div>
</div><!--/wrapper -->
</body>
</html>
