<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{template/baseManage.html}">
<div class="container-fluid" layout:fragment="main-content">

    <div class="row">
        <main class="main-content col-lg-10">
            <div class="main-content-container container-fluid px-4">
                <div class="page-header row no-gutters py-4">
                    <div class="text-center w-100 mb-0">
                        <h3 class="page-title font-weight-bold">エラー</h3>
                    </div>
                </div>
                <!--header -->
                <div class="text-center">
                    <p th:utext="${message}"></p>
                </div>
                <div class="text-center">
                    <button type="button" class="btn btn-accent btn-pill" onclick="window.history.go(-1); return false;">&larr; 戻る</button>
                </div>
            </div>
        </main>
    </div>
</div>
</html>
